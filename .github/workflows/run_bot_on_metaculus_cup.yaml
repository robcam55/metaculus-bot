name: Forecast on Metaculus Cup

on:
  # Manual only: the Metaculus Cup isn't part of the AI tournament, and running it on a
  # schedule would add LLM spend. Re-add a schedule here to take part.
  workflow_dispatch:

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    # A read-only token: no step here writes to GitHub. No step's environment holds
    # GITHUB_TOKEN, so an alert in a Cup run is only written to the log (alerts.py), as
    # it always was. To have these runs open issues, pass the token to the bot step and
    # add issues: write here, both together
    permissions:
      contents: read
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install poetry
        # Poetry 2.5.1 and its own packages, each checked against a sha256 hash in the
        # committed file, so a later release of one of them can't run here (README, "Why
        # it's built this way"). The three settings are the ones the install action used to set
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/poetry-requirements.txt
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry config installer.parallel true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          poetry run python main.py --mode metaculus_cup
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        # No OPENROUTER_API_KEY here: Metaculus's credits are for FutureEval and MiniBench,
        # so the Cup runs only on your own ANTHROPIC_API_KEY.
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Optional settings (repository variables, not secrets); empty = default
          METACULUS_CUP_ID: ${{ vars.METACULUS_CUP_ID }}
          FORECASTER_MODEL: ${{ vars.FORECASTER_MODEL }}
          FORECASTER_EFFORT: ${{ vars.FORECASTER_EFFORT }}
          RESEARCH_WEB_FETCH: ${{ vars.RESEARCH_WEB_FETCH }}
          RESEARCH_TOOLS: ${{ vars.RESEARCH_TOOLS }}
          RESEARCH_TOOL_NOTE: ${{ vars.RESEARCH_TOOL_NOTE }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL }}
          ASKNEWS_STRATEGY: ${{ vars.ASKNEWS_STRATEGY }}
          ASKNEWS_ARTICLES: ${{ vars.ASKNEWS_ARTICLES }}
          RESEARCH_REPORTS: ${{ vars.RESEARCH_REPORTS }}
          PREDICTIONS_PER_REPORT: ${{ vars.PREDICTIONS_PER_REPORT }}