name: Review recent forecasts

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to look for resolved questions"
        default: "120"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday morning

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Scores how the bot's resolved forecasts turned out, and lists tournament questions it
# missed. Read-only on Metaculus: it makes no forecasts, spends nothing on LLMs, and posts
# nothing there. Its one write is an issue in this repository when a question was missed.
# The weekly run is off by default: set the repository variable REVIEW_BOT_ENABLED to
# true to turn it on. Running it by hand always works.
jobs:
  review_job:
    if: vars.REVIEW_BOT_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # the missed-questions alert (missed_check.py); nothing else
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install poetry
        # Poetry 2.5.1 and its own packages, each checked against a sha256 hash in the
        # committed file, so a later release of one of them can't run here (README, "Why
        # it's built this way"). The three settings are the ones the install action used to set
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/poetry-requirements.txt
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry config installer.parallel true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with integrations
      # 120 days back, which covers a season: at 30 the by-setup rows lost each question a
      # month after it resolved, and the s1 row drifted as its questions left. The input is
      # read from the environment, so its text never becomes part of the script
      - name: Review forecasts
        run: |
          poetry run bot-review review \
            --resolved-since "$DAYS" \
            --output review.json \
            --summary review.md
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          DAYS: ${{ inputs.days || 120 }}
      - name: Add the calibration scorecard
        continue-on-error: true # never at the cost of bot-review's summary or the artifact
        run: |
          echo >> review.md
          poetry run python scorecard.py review.json >> review.md
      - name: Look for missed questions
        if: ${{ !cancelled() }} # also when the review step failed: this check doesn't need it
        continue-on-error: true # never at the cost of bot-review's summary or the artifact
        run: |
          echo >> review.md
          poetry run python missed_check.py >> review.md
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }} # opens the missed-questions issue; nothing else
          AIB_TOURNAMENT_ID: ${{ vars.AIB_TOURNAMENT_ID }}
          MINIBENCH_ID: ${{ vars.MINIBENCH_ID }}
      - name: Show the summary in the run page
        if: ${{ !cancelled() }}
        run: cat review.md >> $GITHUB_STEP_SUMMARY
      - name: Keep the review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review
          path: |
            review.json
            review.md
          retention-days: 90
