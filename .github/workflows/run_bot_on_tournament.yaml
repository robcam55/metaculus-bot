name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Who started the run. The Cloudflare clock sends 'cloudflare'; leave this as 'manual'."
        default: manual
  # GitHub fires this only about five times a day, so the 20-minute clock is the
  # Cloudflare Worker in trigger/; this schedule stays as a backup.
  schedule:
    - cron: "7,27,47 * * * *" # every 20 min, offset off the hour. Make sure to skip already-forecasted questions!

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Scheduled runs, and runs the Cloudflare clock starts, stay off until the repository
# variable BOT_ENABLED is set to true (Settings -> Secrets and variables -> Actions ->
# Variables), so they can't fail every 20 minutes before the secrets exist. Running it by
# hand always works.
jobs:
  forecast_job:
    if: vars.BOT_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.source != 'cloudflare')
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    timeout-minutes: 60
    # The bot opens an issue (one email) when the credits run low or Rob's own key stops,
    # rather than failing a run every 20 minutes (alerts.py)
    permissions:
      contents: read
      issues: write
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          poetry run python main.py
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # pays once the credits are under $2
          GITHUB_TOKEN: ${{ github.token }} # opens the alert issues; nothing else
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Optional settings (repository variables, not secrets); empty = default
          BUDGET_TIER: ${{ vars.BUDGET_TIER }}
          AIB_TOURNAMENT_ID: ${{ vars.AIB_TOURNAMENT_ID }}
          MINIBENCH_ID: ${{ vars.MINIBENCH_ID }}
          FORECASTER_MODEL: ${{ vars.FORECASTER_MODEL }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL }}
          ASKNEWS_STRATEGY: ${{ vars.ASKNEWS_STRATEGY }}
          ASKNEWS_ARTICLES: ${{ vars.ASKNEWS_ARTICLES }}
          SEARCH_MODEL: ${{ vars.SEARCH_MODEL }}
          RESEARCH_REPORTS: ${{ vars.RESEARCH_REPORTS }}
          PREDICTIONS_PER_REPORT: ${{ vars.PREDICTIONS_PER_REPORT }}