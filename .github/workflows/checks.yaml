name: Offline checks

# The offline checks on the lockfile's packages, the ones every forecasting run installs
# (litellm 1.80.10 among them). A local virtualenv can drift from the lock: on 2026-10-15
# a local litellm 1.102.1 hid a call that crashes on 1.80.10. No keys, nothing posted.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install poetry
        # Poetry 2.5.1 and its own packages, each checked against a sha256 hash in the
        # committed file, so a later release of one of them can't run here (README, "Why
        # it's built this way"). The three settings are the ones the install action used to set
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/poetry-requirements.txt
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry config installer.parallel true
      - name: Install dependencies (poetry.lock)
        run: poetry install --no-interaction --no-root
      - name: Show the litellm version under test
        run: poetry run python -c "import importlib.metadata as m; print('litellm', m.version('litellm'))"
      - name: Bot checks
        run: poetry run python tests/check_rc_bot.py
      - name: Trigger checks
        run: node trigger/test.mjs
