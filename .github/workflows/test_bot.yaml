name: Test Bot

on:
  workflow_dispatch:
    inputs:
      pay_with:
        description: "Who pays: Metaculus's credits, or your own key (ANTHROPIC_API_KEY)"
        type: choice
        options:
          - credits
          - own-key
        default: credits
      questions:
        description: "How many bot-testing-area questions (empty: the TEST_QUESTIONS variable, or 3)"
        default: ""
      # Trying a new model before a switch (model_watch.py opens an issue for each release).
      # Empty runs the bot's own. On your key, Anthropic's ids: anthropic/claude-...
      forecaster:
        description: "Forecaster model to try (empty: the bot's own)"
        default: ""
      researcher:
        description: "Research model to try, with web search (empty: the bot's own)"
        default: ""
      parser:
        description: "Parsing model to try (empty: the bot's own)"
        default: ""
      extra:
        description: "Extra forecasters to try on your OpenRouter key, e.g. openrouter/openai/gpt-6.1-sol:2 (empty: EXTRA_FORECASTERS)"
        default: ""

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          # pinned like the actions: the version every run has installed since Oct 2026
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          poetry run python main.py --mode test_questions
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAY_WITH: ${{ inputs.pay_with }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Optional settings (repository variables, not secrets); empty = default
          BUDGET_TIER: ${{ vars.BUDGET_TIER }}
          TEST_QUESTIONS: ${{ inputs.questions || vars.TEST_QUESTIONS }}
          FORECASTER_MODEL: ${{ vars.FORECASTER_MODEL }}
          FORECASTER_EFFORT: ${{ vars.FORECASTER_EFFORT }}
          RESEARCH_WEB_FETCH: ${{ vars.RESEARCH_WEB_FETCH }}
          # A second model family, on Rob's own OpenRouter key (off unless both are set)
          OPENROUTER_OWN_API_KEY: ${{ secrets.OPENROUTER_OWN_API_KEY }}
          EXTRA_FORECASTERS: ${{ vars.EXTRA_FORECASTERS }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL }}
          ASKNEWS_STRATEGY: ${{ vars.ASKNEWS_STRATEGY }}
          ASKNEWS_ARTICLES: ${{ vars.ASKNEWS_ARTICLES }}
          SEARCH_MODEL: ${{ vars.SEARCH_MODEL }}
          RESEARCH_REPORTS: ${{ vars.RESEARCH_REPORTS }}
          PREDICTIONS_PER_REPORT: ${{ vars.PREDICTIONS_PER_REPORT }}
          # This workflow's inputs only, never repository variables: no other run tries them
          TRIAL_FORECASTER_MODEL: ${{ inputs.forecaster }}
          TRIAL_RESEARCHER_MODEL: ${{ inputs.researcher }}
          TRIAL_PARSER_MODEL: ${{ inputs.parser }}
          TRIAL_EXTRA_FORECASTERS: ${{ inputs.extra }}